[pytest]
pythonpath = apps/center/src apps/acquisition/src apps/edge/src apps/shared/src
testpaths = apps/center/tests/unit apps/center/tests/contracts apps/acquisition/tests/unit apps/edge/tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    integration: needs the isolated test stack (docker-compose.test.yml); every test under */tests/integration carries it. Run: pytest -m integration apps/center/tests/integration apps/acquisition/tests/integration
