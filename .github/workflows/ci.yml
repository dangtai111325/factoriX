name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        env:
          PYTHONPATH: apps/center/src:apps/edge/src
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pytest apps/center/tests/unit -q
