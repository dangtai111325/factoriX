name: ci

on:
  push:
  pull_request:

jobs:
  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r infrastructure/docker/requirements.txt
          python -m pip install pytest pytest-asyncio
      - name: Run unit, safety, contract & simulator tests
        env:
          FACTORIX_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/factorix_test
          FACTORIX_DATA_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          FACTORIX_ENVIRONMENT: test
          PYTHONPATH: ".:apps/center/src:apps/edge/src"
        run: |
          python -m pytest apps/center/tests/unit apps/edge/tests tests/safety tests/simulators -q

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install & type check & build web
        working-directory: apps/web
        run: |
          npm ci
          npm run check
          npm run build

  storage-integration:
    runs-on: ubuntu-latest
    needs: [python-unit]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: factorix_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4.0-management-alpine
        ports: ["5672:5672", "15672:15672"]
        options: >-
          --health-cmd "su-exec rabbitmq rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      tdengine:
        image: tdengine/tdengine:3.3.6.13
        ports: ["6041:6041"]
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:6041/-/ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r infrastructure/docker/requirements.txt
          python -m pip install aio-pika taos-ws-py pyyaml pytest pytest-asyncio
      - name: Run Postgres migrations & integration tests
        env:
          FACTORIX_ENVIRONMENT: test
          FACTORIX_ENABLE_DESTRUCTIVE_TESTS: YES_I_USE_EPHEMERAL_DB
          FACTORIX_DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/factorix_test
          FACTORIX_DATA_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          FACTORIX_RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/
          FACTORIX_TDENGINE_DSN: ws://root:taosdata@127.0.0.1:6041
          PYTHONPATH: ".:apps/center/src:apps/edge/src"
        run: |
          cd apps/center && alembic upgrade head && cd ../..
          python -m pytest apps/center/tests/integration -q
