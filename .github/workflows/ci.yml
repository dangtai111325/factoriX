name: ci

on:
  push:
  pull_request:

jobs:
  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r infrastructure/docker/requirements.txt
          python -m pip install pytest pytest-asyncio
      - name: Run unit & safety tests
        env:
          FACTORIX_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/factorix_test
          FACTORIX_DATA_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          FACTORIX_ENVIRONMENT: test
        run: |
          python -m pytest apps/center/tests/unit apps/edge/tests tests/safety -q

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install & type check & build web
        working-directory: apps/web
        run: |
          npm ci
          npm run check
          npm run build
