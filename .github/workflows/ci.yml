name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: |
          python -m pip install -r infrastructure/docker/requirements.txt
          python -m pip install pytest pytest-asyncio
          python -m pytest apps/center/tests/unit -q
