[project]
name = "factorix-center"
version = "1.0.0"
description = "FactoriX Industrial IoT Center"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "sqlalchemy==2.1.6",
  "alembic==1.20.1",
  "asyncpg==0.32.0",
  "greenlet==3.5.6",
  "argon2-cffi==25.1.0",
  "httpx==0.28.1",
  "cryptography==50.0.2",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
